[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sshcatch"
dynamic = ["version"]
description = "Quick-deploy SSH server for tunneling and simple SCP transfers - never opens a shell."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LorenzMap" }]
keywords = ["ssh", "pentest", "tunneling", "scp", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
# Pinned exactly due to mimic monkey-patches on asyncssh internals (see mimic-refs/mimic-notes.md)
dependencies = ["asyncssh==2.24.0"]

[project.urls]
Homepage = "https://github.com/LorenzMap/sshcatch"
Repository = "https://github.com/LorenzMap/sshcatch"
Issues = "https://github.com/LorenzMap/sshcatch/issues"

[project.scripts]
sshcatch = "sshcatch:main"

[tool.hatch.version]
path = "sshcatch.py"

[tool.hatch.build.targets.wheel]
only-include = ["sshcatch.py"]

[tool.hatch.build.targets.sdist]
only-include = ["sshcatch.py", "README.md", "CHANGELOG.md", "LICENSE"]
